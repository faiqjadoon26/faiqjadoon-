<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact | Faiq Jadoon</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-image: url('blurred-code.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      background-color: #121212;
      color: #e0e0e0;
      filter: brightness(0.97);
      min-height: 100vh;
    }

    header {
      background-color: transparent;
      padding: 1.2rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      margin: 0;
      color: #00d1b2;
      font-size: 1.8rem;
    }

    nav a {
      color: #e63946;
      text-decoration: none;
      margin-left: 1.5rem;
      font-weight: bold;
      font-size: 1.1rem;
    }

    nav a:hover {
      text-decoration: underline;
    }

    hr.nav-divider {
      border: none;
      height: 6px;
      background-color: #00d1b2;
      margin: 0;
      width: 100%;
    }

    .main-content {
      max-width: 700px;
      margin: 50px auto;
      background-color: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(5px);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.3);
    }

    h2 {
      color: #00d1b2;
      text-align: center;
      margin-bottom: 2rem;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    label {
      margin-bottom: 0.5rem;
      font-weight: bold;
    }

    input, textarea {
      padding: 0.8rem;
      margin-bottom: 1.5rem;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      background-color: #1f1f1f;
      color: #e0e0e0;
    }

    input:focus, textarea:focus {
      outline: 2px solid #00d1b2;
    }

    button {
      background-color: #00d1b2;
      color: #121212;
      padding: 0.8rem;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #00b89c;
    }

    .social {
      text-align: center;
      margin-top: 1.5rem;
    }

    .social a {
      color: #00d1b2;
      text-decoration: none;
      font-size: 1.2rem;
    }

    footer {
      text-align: center;
      padding: 1rem;
      background-color: #1a1a1a;
      color: #666;
      font-size: 0.9rem;
      margin-top: 50px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Faiq Jadoon</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="projects.html">Projects</a>
      <a href="resume.html">Resume</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>
  <hr class="nav-divider" />

  <main class="main-content">
    <h2>Contact Me</h2>
    <form action="https://formspree.io/f/xqalzvan" method="POST">
      <label for="name">Name</label>
      <input type="text" name="name" id="name" required />

      <label for="email">Email</label>
      <input type="email" name="email" id="email" required />

      <label for="message">Message</label>
      <textarea name="message" id="message" rows="6" required></textarea>

      <button type="submit">Send Message</button>
    </form>

    <div class="social">
      <p>Or message me on Instagram:  
        <a href="https://instagram.com/jadoon_faiq" target="_blank">@jadoon_faiq</a>
      </p>
    </div>
  </main>

  <footer>
    <p>© 2025 Faiq Jadoon. All rights reserved.</p>
  </footer>
</body>
</html>
