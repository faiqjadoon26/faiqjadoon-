<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact | Faiq Jadoon</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      color: #e0e0e0;
      background-image: url('blurred-code.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      background-color: #121212;
      filter: brightness(0.97);
      position: relative;
      min-height: 100vh;
    }

    .hero-bg {
      position: absolute;
      top: 150px;
      left: 0;
      width: 100%;
      height: 320px;
      overflow: hidden;
      z-index: -1;
    }

    .hero-bg svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .hero-bg path {
      fill: #e63946 !important;
      fill-opacity: 1 !important;
    }

    header {
      background-color: transparent;
      padding: 1.2rem 2rem 0.5rem 2rem;
      position: relative;
      z-index: 10;
    }

    header h1 {
      margin: 0;
      color: #00d1b2;
    }

    nav {
      margin-top: 0.5rem;
    }

    nav a {
      color: #e63946;
      text-decoration: none;
      margin-right: 1rem;
      font-weight: bold;
      font-size: 1.1rem;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .main-content {
      max-width: 700px;
      margin: 420px auto 50px;
      background-color: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(5px);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.3);
    }

    h2 {
      color: #e63946;
      text-align: center;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    label {
      font-weight: bold;
      color: #00d1b2;
    }

    input, textarea {
      padding: 0.8rem;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
      background-color: #1e1e1e;
      color: #fff;
    }

    input:focus, textarea:focus {
      outline: 2px solid #00d1b2;
    }

    button {
      padding: 0.8rem;
      background-color: #e63946;
      border: none;
      color: white;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #c82636;
    }

    #thank-you {
      display: none;
      margin-top: 20px;
      font-weight: bold;
      color: #00d1b2;
      text-align: center;
    }

    footer {
      text-align: center;
      padding: 1rem;
      background-color: #1a1a1a;
      color: #666;
      font-size: 0.9rem;
      position: relative;
      z-index: 10;
    }
  </style>
</head>
<body>

  <header>
    <h1>Faiq Jadoon</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="projects.html">Projects</a>
      <a href="resume.html">Resume</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <div class="hero-bg">
    <svg viewBox="0 0 1440 320" preserveAspectRatio="none">
      <path d="M0,224L60,192L120,160L180,160L240,192L300,224L360,192L420,128L480,128L540,160L600,192L660,160L720,128L780,160L840,224L900,256L960,224L1020,160L1080,128L1140,160L1200,224L1260,224L1320,192L1380,160L1440,160L1440,0L0,0Z"></path>
    </svg>
  </div>

  <main class="main-content">
    <h2>Contact Me</h2>
    <form id="contact-form" action="https://formspree.io/f/xqalzvan" method="POST">
      <label for="name">Your Name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Your Email</label>
      <input type="email" id="email" name="email" required>

      <label for="message">Your Message</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <button type="submit">Send Message</button>
    </form>

    <div id="thank-you">
      ✅ Thanks, your message has been sent!
    </div>
  </main>

  <footer>
    <p>© 2025 Faiq Jadoon. All rights reserved.</p>
  </footer>

  <script>
    const form = document.getElementById('contact-form');
    const thankYou = document.getElementById('thank-you');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData(form);
      const response = await fetch(form.action, {
        method: form.method,
        body: formData,
        headers: {
          'Accept': 'application/json'
        }
      });

      if (response.ok) {
        form.reset();
        form.style.display = 'none';
        thankYou.style.display = 'block';
      } else {
        thankYou.textContent = '❌ Oops! Something went wrong.';
        thankYou.style.color = 'red';
        thankYou.style.display = 'block';
      }
    });
  </script>

</body>
</html>
